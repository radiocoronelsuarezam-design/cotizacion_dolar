<!-- LÓGICA JAVASCRIPT -->
<!-- LÓGICA JAVASCRIPT -->
<script>
    (async function cargarBannerCotizaciones() {
        // Apuntamos directamente a la URL de origen a través de corsproxy.io
        const TIMESTAMP = new Date().getTime();
        const TARGET_URL = `https://www.cotizacion-dolar.com.ar/recursos-webmaster/promedios/cotizacion-argentina-adaptable.php?v=${TIMESTAMP}`;
        const PROXY_URL = `https://corsproxy.io/?${encodeURIComponent(TARGET_URL)}`;

        try {
            const respuesta = await fetch(PROXY_URL, {
                headers: {
                    "Cache-Control": "no-cache"
                }
            });

            // Convertimos la respuesta a Text usando decodificación ISO-8859-1 (latin1)
            const buffer = await respuesta.arrayBuffer();
            const decoder = new TextDecoder('iso-8859-1');
            const htmlBruto = decoder.decode(buffer);

            const widget = document.getElementById("mi-widget-cotizaciones");
            const contenedor = widget.querySelector("#contenedor-banner");

            if (htmlBruto) {
                const parser = new DOMParser();
                const doc = parser.parseFromString(htmlBruto, 'text/html');

                const elementoFecha = doc.querySelector('.dolar_fecha_2');
                if (elementoFecha) {
                    widget.querySelector('#fecha-update').innerText = elementoFecha.innerText.trim();
                }

                const estilosOriginales = doc.querySelectorAll('style, link[rel="stylesheet"], script');
                estilosOriginales.forEach(el => el.remove());

                let htmlLimpio = doc.body.innerHTML.replace(/DÃ³lar/g, 'Dólar');
                contenedor.innerHTML = htmlLimpio;

                // REEMPLAZO DINÁMICO DE CABECERA: Cambia (+60%) por TURISTA
                const celdasCabecera = contenedor.querySelectorAll('.cotizacion_dolar_int tr:nth-child(2) td');
                celdasCabecera.forEach(td => {
                    if (td.innerHTML.includes('%')) {
                        td.innerHTML = 'TURISTA';
                    }
                });

            } else {
                contenedor.innerHTML = "<div class='loading'>Error en el formato de datos.</div>";
            }

        } catch (error) {
            console.error("Error al cargar cotizaciones:", error);
            document.querySelector("#mi-widget-cotizaciones #contenedor-banner").innerHTML =
                "<div class='loading'>Servicio temporalmente no disponible.</div>";
        }
    })();
</script>
